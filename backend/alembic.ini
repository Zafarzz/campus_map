# Alembic configuration.
#
# The database URL is NOT stored here: it comes from the environment through
# app.core.config (see alembic/env.py). Nothing in this repository ever holds a
# credential in a tracked file.
#
# Migrations are the only way the schema changes (MASTER_PROMPT.md 0.4 rule 4).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, readable revision filenames.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Fail rather than silently truncate a long auto-generated slug.
truncate_slug_length = 60

[post_write_hooks]
# console_scripts runs ruff's entry point inside the *current* interpreter, so
# this works from backend/.venv and from the container without ruff being on
# PATH. (An `exec` hook resolves the executable through PATH and fails there.)
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

